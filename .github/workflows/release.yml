# Tags and releases a version when its number is bumped in plugin.json and written in CHANGELOG.md.
# The notes are that CHANGELOG section plus the commits since the previous tag.
name: Release

on:
  push:
    branches: [main]
    paths:
      - plugin/.claude-plugin/plugin.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test
        run: |
          bash tests/hooks.test.sh
          node --test tests/ship.test.mjs
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged, nothing to release"
            exit 0
          fi
          bash scripts/release-notes.sh "$version" > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "dotagent $version" --notes-file notes.md --latest
