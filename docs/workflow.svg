<polyline points="1134,311 1204,480" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1204,580 1134,749" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1004,844 955,864" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="735,864 686,844" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="556,749 486,580" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="486,480 556,311" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="686,216 735,196" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<text x="845" y="47" text-anchor="middle" font-size="34" font-weight="700" fill="#212529">dotagent</text>
<text x="845" y="72" text-anchor="middle" font-size="18" fill="#212529">one loop, verified every turn</text>
<rect x="685" y="442" width="320" height="176" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2.5"/>
<text x="845" y="480" text-anchor="middle" font-size="25" font-weight="700" fill="#212529">STOP</text>
<text x="845" y="514" text-anchor="middle" font-size="16" fill="#343a40">no-progress, premise,</text>
<text x="845" y="534" text-anchor="middle" font-size="16" fill="#343a40">needs-human, question,</text>
<text x="845" y="555" text-anchor="middle" font-size="16" fill="#343a40">red-base, conflict,</text>
<text x="845" y="576" text-anchor="middle" font-size="16" fill="#343a40">denied, budget, error</text>
<text x="845" y="606" text-anchor="middle" font-size="16" fill="#c92a2a">report + next:</text>
<polyline points="1064,749 933,618" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#r)"/>
<polyline points="626,311 757,442" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#r)"/>
<text x="845" y="1015" text-anchor="middle" font-size="18" fill="#212529"><tspan font-weight="700" fill="#212529">Hooks</tspan>: names, <tspan font-weight="700" fill="#212529">no trailer</tspan>, <tspan font-weight="700" fill="#212529">protected paths</tspan>, <tspan font-weight="700" fill="#212529">workflow mode</tspan>, <tspan font-weight="700" fill="#212529">read only</tspan> planning. Every unit logs its proof. No unsolicited docs.</text>
</svg>
