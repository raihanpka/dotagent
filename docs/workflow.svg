<polyline points="1117,313 1170,440" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1170,560 1117,687" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="962,801 975,796" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="715,796 728,801" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="573,687 520,560" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="520,440 573,313" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="728,199 715,204" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<text x="845" y="51" text-anchor="middle" font-size="34" font-weight="700" fill="#212529">dotagent</text>
<text x="845" y="76" text-anchor="middle" font-size="18" fill="#212529">one loop, verified every turn</text>
<rect x="685" y="412" width="320" height="176" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2.5"/>
<text x="845" y="450" text-anchor="middle" font-size="25" font-weight="700" fill="#212529">STOP</text>
<text x="845" y="484" text-anchor="middle" font-size="16" fill="#343a40">no-progress, premise,</text>
<text x="845" y="504" text-anchor="middle" font-size="16" fill="#343a40">needs-human, question,</text>
<text x="845" y="525" text-anchor="middle" font-size="16" fill="#343a40">red-base, conflict,</text>
<text x="845" y="546" text-anchor="middle" font-size="16" fill="#343a40">denied, budget, error</text>
<text x="845" y="576" text-anchor="middle" font-size="16" fill="#c92a2a">report + next:</text>
<polyline points="1032,687 933,588" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#r)"/>
<polyline points="658,313 757,412" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#r)"/>
<text x="845" y="972" text-anchor="middle" font-size="18" fill="#212529"><tspan font-weight="700" fill="#212529">Hooks</tspan>: names, <tspan font-weight="700" fill="#212529">no trailer</tspan>, <tspan font-weight="700" fill="#212529">protected paths</tspan>, <tspan font-weight="700" fill="#212529">workflow mode</tspan>, <tspan font-weight="700" fill="#212529">read only</tspan> planning. Every unit logs its proof. No unsolicited docs.</text>
</svg>
