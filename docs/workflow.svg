<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs>
<rect width="1500" height="760" fill="#ffffff"/>
<text x="1440" y="52" text-anchor="end" font-size="26" font-weight="700" fill="#212529">dotagent: /dotagent:ship</text>
<rect x="60" y="42" width="26" height="26" rx="6" fill="#a5d8ff" stroke="#343a40" stroke-width="2"/><text x="96" y="62" font-size="18" fill="#212529">Sonnet: plans and reviews</text>
<rect x="360" y="42" width="26" height="26" rx="6" fill="#b2f2bb" stroke="#343a40" stroke-width="2"/><text x="396" y="62" font-size="18" fill="#212529">Haiku: does one narrow job</text>
<rect x="660" y="42" width="26" height="26" rx="6" fill="#ffec99" stroke="#343a40" stroke-width="2"/><text x="696" y="62" font-size="18" fill="#212529">fixed step: git, gh, CI</text>
<rect x="60" y="130" width="290" height="120" rx="14" fill="#e9ecef" stroke="#343a40" stroke-width="2.5"/>
<text x="205" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">task</text>
<text x="205" y="200" text-anchor="middle" font-size="18" fill="#343a40">typed prompt, plus pasted</text>
<text x="205" y="226" text-anchor="middle" font-size="18" fill="#343a40">product requirements</text>
<rect x="430" y="130" width="290" height="120" rx="14" fill="#b2f2bb" stroke="#343a40" stroke-width="2.5"/>
<text x="575" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">branch: Haiku</text>
<text x="575" y="200" text-anchor="middle" font-size="18" fill="#343a40">cuts feat/&lt;slug&gt; from</text>
<text x="575" y="226" text-anchor="middle" font-size="18" fill="#343a40">the default branch</text>
<rect x="800" y="130" width="290" height="120" rx="14" fill="#a5d8ff" stroke="#343a40" stroke-width="2.5"/>
<text x="945" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">plan: Sonnet</text>
<text x="945" y="200" text-anchor="middle" font-size="18" fill="#343a40">writes tasks/plan.md</text>
<text x="945" y="226" text-anchor="middle" font-size="18" fill="#343a40">8 slices, about 400 lines</text>
<rect x="1170" y="130" width="290" height="120" rx="14" fill="#b2f2bb" stroke="#343a40" stroke-width="2.5"/>
<text x="1315" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">slices: Haiku x N</text>
<text x="1315" y="200" text-anchor="middle" font-size="18" fill="#343a40">one slicer per slice, in order</text>
<text x="1315" y="226" text-anchor="middle" font-size="18" fill="#343a40">test, build, lint, one commit</text>
<rect x="1170" y="400" width="290" height="120" rx="14" fill="#a5d8ff" stroke="#343a40" stroke-width="2.5"/>
<text x="1315" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">review: Sonnet</text>
<text x="1315" y="470" text-anchor="middle" font-size="18" fill="#343a40">fresh context, diff vs plan</text>
<text x="1315" y="496" text-anchor="middle" font-size="18" fill="#343a40">2 fix rounds</text>
<rect x="800" y="400" width="290" height="120" rx="14" fill="#b2f2bb" stroke="#343a40" stroke-width="2.5"/>
<text x="945" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">pr: Haiku</text>
<text x="945" y="470" text-anchor="middle" font-size="18" fill="#343a40">push the branch,</text>
<text x="945" y="496" text-anchor="middle" font-size="18" fill="#343a40">open the PR from the template</text>
<rect x="430" y="400" width="290" height="120" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="575" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">ci: watch checks</text>
<text x="575" y="470" text-anchor="middle" font-size="18" fill="#343a40">gh pr checks --watch</text>
<text x="575" y="496" text-anchor="middle" font-size="18" fill="#343a40">2 fix rounds</text>
<rect x="60" y="400" width="290" height="120" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="205" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">merge: by level</text>
<text x="205" y="470" text-anchor="middle" font-size="18" fill="#343a40">off: stop at the PR</text>
<text x="205" y="496" text-anchor="middle" font-size="18" fill="#343a40">on-green or full: merge (#N)</text>
<line x1="350" y1="190" x2="430" y2="190" stroke="#343a40" stroke-width="3" marker-end="url(#a)"/>
<line x1="720" y1="190" x2="800" y2="190" stroke="#343a40" stroke-width="3" marker-end="url(#a)"/>
<line x1="1090" y1="190" x2="1170" y2="190" stroke="#343a40" stroke-width="3" marker-end="url(#a)"/>
<line x1="1315" y1="250" x2="1315" y2="400" stroke="#343a40" stroke-width="3" marker-end="url(#a)"/>
<line x1="1170" y1="460" x2="1090" y2="460" stroke="#343a40" stroke-width="3" marker-end="url(#a)"/>
<line x1="800" y1="460" x2="720" y2="460" stroke="#343a40" stroke-width="3" marker-end="url(#a)"/>
<line x1="430" y1="460" x2="350" y2="460" stroke="#343a40" stroke-width="3" marker-end="url(#a)"/>
<rect x="800" y="272" width="290" height="44" rx="10" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6"/><text x="945" y="300" text-anchor="middle" font-size="17" fill="#212529">too big: stop, split into two tasks</text>
<rect x="1170" y="542" width="290" height="44" rx="10" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6"/><text x="1315" y="570" text-anchor="middle" font-size="17" fill="#212529">still not clean: stop and report</text>
<rect x="430" y="542" width="290" height="44" rx="10" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6"/><text x="575" y="570" text-anchor="middle" font-size="17" fill="#212529">still red after 2 rounds: stop</text>
<rect x="60" y="640" width="1400" height="90" rx="14" fill="#f8f9fa" stroke="#343a40" stroke-width="2.5" stroke-dasharray="3 0"/>
<text x="760" y="678" text-anchor="middle" font-size="19" fill="#212529">hooks guard every step: commit is type(scope): summary, one line, no trailer</text>
<text x="760" y="706" text-anchor="middle" font-size="19" fill="#212529">PR title format  |  merge level  |  no em dash  |  reads over 350 lines blocked</text>
</svg>