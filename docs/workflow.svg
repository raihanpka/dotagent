<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1690 1014" width="1690" height="1014" font-family="Excalifont, Virgil, 'Segoe Print', 'Comic Sans MS', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="r" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="1690" height="1014" fill="#ffffff"/>
<rect x="715" y="90" width="260" height="120" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
<text x="845" y="122" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Goal</text>
<text x="845" y="152" text-anchor="middle" font-size="16" fill="#343a40">A checkable finish:</text>
<text x="845" y="172" text-anchor="middle" font-size="16" fill="#343a40">a command or artifact</text>
<rect x="962.487" y="192.513" width="260" height="120" rx="14" fill="#d0bfff" stroke="#6741d9" stroke-width="2.5"/>
