<text x="1113.7" y="294" text-anchor="middle" font-size="16" fill="#343a40">goal, finish, prove</text>
<rect x="1115" y="480" width="220" height="100" rx="14" fill="#ffec99" stroke="#e67700" stroke-width="2.5"/>
<text x="1225" y="512" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">One unit</text>
<text x="1225" y="542" text-anchor="middle" font-size="16" fill="#343a40">Smallest change,</text>
<text x="1225" y="562" text-anchor="middle" font-size="16" fill="#343a40">only the plan's files</text>
<rect x="1003.7" y="748.701" width="220" height="100" rx="14" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="1113.7" y="781" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Verify</text>
<text x="1113.7" y="810" text-anchor="middle" font-size="16" fill="#343a40">Scoped check:</text>
<text x="1113.7" y="831" text-anchor="middle" font-size="16" fill="#343a40">format, lint, test</text>
<rect x="735" y="860" width="220" height="100" rx="14" fill="#99e9f2" stroke="#0b7285" stroke-width="2.5"/>
<text x="845" y="892" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Prove</text>
<text x="845" y="922" text-anchor="middle" font-size="16" fill="#343a40">Real artifact:</text>
<text x="845" y="942" text-anchor="middle" font-size="16" fill="#343a40">run it, read it, show it</text>
<rect x="466.299" y="748.701" width="220" height="100" rx="14" fill="#ffd8a8" stroke="#d9480f" stroke-width="2.5"/>
<text x="576.299" y="781" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Review</text>
<text x="576.299" y="810" text-anchor="middle" font-size="16" fill="#343a40">Fresh context:</text>
<text x="576.299" y="831" text-anchor="middle" font-size="16" fill="#343a40">proof plus gaps</text>
<rect x="355" y="480" width="220" height="100" rx="14" fill="#a5d8ff" stroke="#1864ab" stroke-width="2.5"/>
<text x="465" y="512" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Ship</text>
<text x="465" y="542" text-anchor="middle" font-size="16" fill="#343a40">PR, CI, merge</text>
<text x="465" y="562" text-anchor="middle" font-size="16" fill="#343a40">by the workflow</text>
<rect x="466.299" y="211.299" width="220" height="100" rx="14" fill="#e9ecef" stroke="#495057" stroke-width="2.5"/>
<text x="576.299" y="243" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Progress</text>
<text x="576.299" y="273" text-anchor="middle" font-size="16" fill="#343a40">Commit, tick, log,</text>
<text x="576.299" y="294" text-anchor="middle" font-size="16" fill="#343a40">state = moved</text>
