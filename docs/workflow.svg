<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1690 1010" width="1690" height="1010" font-family="Inter, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="r" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="1690" height="1010" fill="#ffffff"/>
<text x="1630" y="52" text-anchor="end" font-size="26" font-weight="700" fill="#212529">Dotagent: /dotagent</text>
<rect x="60" y="38" width="26" height="26" rx="6" fill="#a5d8ff" stroke="#343a40" stroke-width="2"/>
<text x="96" y="59" text-anchor="start" font-size="17" fill="#212529">Lead: plans, builds, fixes</text>
<rect x="400" y="38" width="26" height="26" rx="6" fill="#b2f2bb" stroke="#343a40" stroke-width="2"/>
<text x="436" y="59" text-anchor="start" font-size="17" fill="#212529">Reviewer: fresh context</text>
<rect x="700" y="38" width="26" height="26" rx="6" fill="#ffec99" stroke="#343a40" stroke-width="2"/>
<text x="736" y="59" text-anchor="start" font-size="17" fill="#212529">Fixed step: git, gh, CI</text>
<rect x="1000" y="38" width="26" height="26" rx="6" fill="#ffc9c9" stroke="#343a40" stroke-width="2"/>
<text x="1036" y="59" text-anchor="start" font-size="17" fill="#212529">Escalation, then stop</text>
<rect x="30" y="90" width="1630" height="176" rx="16" fill="#e7f5ff" stroke="#ced4da" stroke-width="1.5"/>
<text x="1642" y="117" text-anchor="end" font-size="17" font-weight="700" fill="#495057">Lead: plans, builds, and fixes in one context</text>
<rect x="30" y="290" width="1630" height="176" rx="16" fill="#ebfbee" stroke="#ced4da" stroke-width="1.5"/>
<text x="1642" y="317" text-anchor="end" font-size="17" font-weight="700" fill="#495057">Verifier: one reviewer, fresh context, read only</text>
<rect x="30" y="490" width="1630" height="176" rx="16" fill="#fff9db" stroke="#ced4da" stroke-width="1.5"/>
<text x="1642" y="517" text-anchor="end" font-size="17" font-weight="700" fill="#495057">Fixed steps: plain commands, no agent</text>
<rect x="60" y="142" width="170" height="112" rx="14" fill="#e9ecef" stroke="#343a40" stroke-width="2.5"/>
<text x="145" y="173" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Task</text>
<text x="145" y="198" text-anchor="middle" font-size="15" fill="#343a40">Typed prompt plus</text>
<text x="145" y="220" text-anchor="middle" font-size="15" fill="#343a40">pasted requirements</text>
<rect x="260" y="142" width="170" height="112" rx="14" fill="#a5d8ff" stroke="#343a40" stroke-width="2.5"/>
<text x="345" y="173" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Plan: Lead</text>
<text x="345" y="198" text-anchor="middle" font-size="15" fill="#343a40">Writes TODO.md, asks</text>
<text x="345" y="220" text-anchor="middle" font-size="15" fill="#343a40">you directly</text>
<rect x="1000" y="342" width="170" height="112" rx="14" fill="#b2f2bb" stroke="#343a40" stroke-width="2.5"/>
<text x="1085" y="373" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Review</text>
<text x="1085" y="398" text-anchor="middle" font-size="15" fill="#343a40">Fresh context,</text>
<text x="1085" y="420" text-anchor="middle" font-size="15" fill="#343a40">reads the diff</text>
<rect x="460" y="142" width="170" height="112" rx="14" fill="#a5d8ff" stroke="#343a40" stroke-width="2.5"/>
<text x="545" y="173" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Build: Lead</text>
<text x="545" y="198" text-anchor="middle" font-size="15" fill="#343a40">Every subtask, one</text>
<text x="545" y="220" text-anchor="middle" font-size="15" fill="#343a40">commit, ticks TODO</text>
<rect x="60" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="145" y="573" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Branch</text>
<text x="145" y="598" text-anchor="middle" font-size="15" fill="#343a40">Cut from the</text>
<text x="145" y="620" text-anchor="middle" font-size="15" fill="#343a40">default branch</text>
<rect x="1000" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="1085" y="573" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Open PR</text>
<text x="1085" y="598" text-anchor="middle" font-size="15" fill="#343a40">Push and open</text>
<text x="1085" y="620" text-anchor="middle" font-size="15" fill="#343a40">the PR</text>
<rect x="1220" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="1305" y="573" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Watch CI</text>
<text x="1305" y="598" text-anchor="middle" font-size="15" fill="#343a40">Watch the checks,</text>
<text x="1305" y="620" text-anchor="middle" font-size="15" fill="#343a40">red goes to fixes</text>
<rect x="1440" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="1525" y="573" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Merge</text>
<text x="1525" y="597" text-anchor="middle" font-size="14" fill="#343a40">local: stays local</text>
<text x="1525" y="618" text-anchor="middle" font-size="14" fill="#343a40">ask: after your yes</text>
<text x="1525" y="638" text-anchor="middle" font-size="14" fill="#343a40">auto: merges itself</text>
<polyline points="145,257 145,539" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="233,598 317,598 317,257" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="432,198 458,198" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="545,257 545,598 700,598" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1085,457 1085,539" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1173,598 1217,598" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1393,598 1437,598" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<rect x="1220" y="336" width="340" height="124" rx="14" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1390" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Fix and retry</text>
<text x="1390" y="387" text-anchor="middle" font-size="14" fill="#343a40">A failed check, review gap, or red CI</text>
<text x="1390" y="408" text-anchor="middle" font-size="14" fill="#343a40">1. Lead fixes, one try</text>
<text x="1390" y="428" text-anchor="middle" font-size="14" fill="#343a40">2. Lead retries with the full log</text>
<text x="1390" y="448" text-anchor="middle" font-size="14" fill="#343a40">Still failing: stop and report</text>
<rect x="60" y="880" width="1570" height="96" rx="14" fill="#f8f9fa" stroke="#343a40" stroke-width="2.5"/>
<text x="845" y="919" text-anchor="middle" font-size="17" fill="#212529"><tspan font-weight="700" fill="#212529">Hooks</tspan> guard every step.</text>
<text x="845" y="947" text-anchor="middle" font-size="17" fill="#212529">Commit and PR names, <tspan font-weight="700" fill="#212529">no trailer</tspan>, <tspan font-weight="700" fill="#212529">protected paths</tspan>, <tspan font-weight="700" fill="#212529">workflow mode</tspan>, <tspan font-weight="700" fill="#212529">read only</tspan> planning.</text>
<rect x="700" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="785" y="573" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Full gate</text>
<text x="785" y="598" text-anchor="middle" font-size="15" fill="#343a40">Once per commit,</text>
<text x="785" y="620" text-anchor="middle" font-size="15" fill="#343a40">recorded</text>
<polyline points="873,598 935,598 935,398 1000,398" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1173,398 1217,398" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#r)" marker-start="url(#r)"/>
<polyline points="1305,542 1305,463" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#r)" marker-start="url(#r)"/>
<polyline points="1525,654 1525,680 145,680 145,656" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<text x="835" y="699" text-anchor="middle" font-size="14" fill="#495057">then the next PR: ask and auto go on until every PR is merged or a stop, local keeps one branch</text>
<rect x="60" y="722" width="500" height="134" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2.5"/>
<text x="310" y="755" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">local</text>
<text x="76" y="782" text-anchor="start" font-size="15" fill="#343a40">Stops at local commits</text>
<text x="76" y="804" text-anchor="start" font-size="15" fill="#343a40">One branch for the whole TODO, one commit per subtask.</text>
<text x="76" y="826" text-anchor="start" font-size="15" fill="#343a40">No push, no PR, no CI, the hook refuses them.</text>
<text x="76" y="848" text-anchor="start" font-size="15" fill="#343a40">At the end: a local squash, or the branch is left to you.</text>
<rect x="595" y="722" width="500" height="134" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2.5"/>
<text x="845" y="755" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">ask</text>
<text x="611" y="782" text-anchor="start" font-size="15" fill="#343a40">Same steps, one PR per plan item</text>
<text x="611" y="804" text-anchor="start" font-size="15" fill="#343a40">Commits locally, then waits for your yes before the push,</text>
<text x="611" y="826" text-anchor="start" font-size="15" fill="#343a40">the PR, and the merge. One yes covers one PR.</text>
<text x="611" y="848" text-anchor="start" font-size="15" fill="#343a40">After a yes: CI is watched and the squash merge follows.</text>
<rect x="1130" y="722" width="500" height="134" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2.5"/>
<text x="1380" y="755" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">auto (default)</text>
<text x="1146" y="782" text-anchor="start" font-size="15" fill="#343a40">Goes all the way, then starts the next PR</text>
<text x="1146" y="804" text-anchor="start" font-size="15" fill="#343a40">Pushes, opens the PR, watches CI, fixes a red check</text>
<text x="1146" y="826" text-anchor="start" font-size="15" fill="#343a40">(two tries), rebases, squash merges when the review is</text>
<text x="1146" y="848" text-anchor="start" font-size="15" fill="#343a40">clean and CI is green. Stops on a failure or a question.</text>
</svg>
