<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1690 1074" width="1690" height="1074" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="r" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="1690" height="1074" fill="#ffffff"/>
<text x="1630" y="52" text-anchor="end" font-size="26" font-weight="700" fill="#212529">Dotagent: /dotagent:ship</text>
<rect x="60" y="38" width="26" height="26" rx="6" fill="#a5d8ff" stroke="#343a40" stroke-width="2"/>
<text x="96" y="59" text-anchor="start" font-size="17" fill="#212529">Lead: Plans, Builds, Fixes</text>
<rect x="400" y="38" width="26" height="26" rx="6" fill="#b2f2bb" stroke="#343a40" stroke-width="2"/>
<text x="436" y="59" text-anchor="start" font-size="17" fill="#212529">Reviewer: Fresh Context</text>
<rect x="700" y="38" width="26" height="26" rx="6" fill="#ffec99" stroke="#343a40" stroke-width="2"/>
<text x="736" y="59" text-anchor="start" font-size="17" fill="#212529">Fixed Step: Git, GitHub CLI, CI</text>
<rect x="1000" y="38" width="26" height="26" rx="6" fill="#ffc9c9" stroke="#343a40" stroke-width="2"/>
<text x="1036" y="59" text-anchor="start" font-size="17" fill="#212529">Escalation, Then Stop</text>
<rect x="30" y="90" width="1630" height="176" rx="16" fill="#e7f5ff" stroke="#ced4da" stroke-width="1.5"/>
<text x="1642" y="117" text-anchor="end" font-size="17" font-weight="700" fill="#495057">Lead: Plans, Builds, and Fixes in One Context</text>
<rect x="30" y="290" width="1630" height="176" rx="16" fill="#ebfbee" stroke="#ced4da" stroke-width="1.5"/>
<text x="1642" y="317" text-anchor="end" font-size="17" font-weight="700" fill="#495057">Verifier: One Reviewer, Fresh Context, Read Only</text>
<rect x="30" y="490" width="1630" height="176" rx="16" fill="#fff9db" stroke="#ced4da" stroke-width="1.5"/>
<text x="1642" y="517" text-anchor="end" font-size="17" font-weight="700" fill="#495057">Fixed Steps: Plain Commands, No Agent</text>
<rect x="60" y="142" width="170" height="112" rx="14" fill="#e9ecef" stroke="#343a40" stroke-width="2.5"/>
<text x="145" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Task</text>
<text x="145" y="208" text-anchor="middle" font-size="15" fill="#343a40">Typed prompt and</text>
<text x="145" y="228" text-anchor="middle" font-size="15" fill="#343a40">pasted requirements</text>
<rect x="260" y="142" width="170" height="112" rx="14" fill="#a5d8ff" stroke="#343a40" stroke-width="2.5"/>
<text x="345" y="176" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Plan: Lead</text>
<text x="345" y="200" text-anchor="middle" font-size="15" fill="#343a40">Writes TODO.md,</text>
<text x="345" y="219" text-anchor="middle" font-size="15" fill="#343a40">decides open points,</text>
<text x="345" y="238" text-anchor="middle" font-size="15" fill="#343a40">asks if blocked</text>
<rect x="1000" y="342" width="170" height="112" rx="14" fill="#b2f2bb" stroke="#343a40" stroke-width="2.5"/>
<text x="1085" y="385" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Review</text>
<text x="1085" y="408" text-anchor="middle" font-size="15" fill="#343a40">Fresh context,</text>
<text x="1085" y="428" text-anchor="middle" font-size="15" fill="#343a40">reads the diff</text>
<rect x="460" y="142" width="170" height="112" rx="14" fill="#a5d8ff" stroke="#343a40" stroke-width="2.5"/>
<text x="545" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Build: Lead</text>
<text x="545" y="208" text-anchor="middle" font-size="15" fill="#343a40">One commit each,</text>
<text x="545" y="228" text-anchor="middle" font-size="15" fill="#343a40">then ticked in TODO</text>
<rect x="60" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="145" y="585" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Branch</text>
<text x="145" y="608" text-anchor="middle" font-size="15" fill="#343a40">Cut from the</text>
<text x="145" y="628" text-anchor="middle" font-size="15" fill="#343a40">default branch</text>
<rect x="1000" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="1085" y="585" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Pull Request</text>
<text x="1085" y="608" text-anchor="middle" font-size="15" fill="#343a40">Push the branch, then</text>
<text x="1085" y="628" text-anchor="middle" font-size="15" fill="#343a40">open the pull request</text>
<rect x="1220" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="1305" y="585" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Watch CI</text>
<text x="1305" y="608" text-anchor="middle" font-size="15" fill="#343a40">Watch the checks,</text>
<text x="1305" y="628" text-anchor="middle" font-size="15" fill="#343a40">red goes to fixes</text>
<rect x="1440" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="1525" y="576" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Merge</text>
<text x="1525" y="598" text-anchor="middle" font-size="14" fill="#343a40">local: stays local</text>
<text x="1525" y="617" text-anchor="middle" font-size="14" fill="#343a40">ask: prompt first</text>
<text x="1525" y="635" text-anchor="middle" font-size="14" fill="#343a40">auto: merges itself</text>
<polyline points="145,257 145,539" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="233,598 317,598 317,257" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="432,198 458,198" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="545,257 545,598 700,598" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1085,457 1085,539" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1173,598 1217,598" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1393,598 1437,598" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<rect x="1220" y="336" width="340" height="124" rx="14" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1390" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Fix and Retry</text>
<text x="1390" y="387" text-anchor="middle" font-size="14" fill="#343a40">A failed check, review gap, or red CI</text>
<text x="1390" y="406" text-anchor="middle" font-size="14" fill="#343a40">1. Lead fixes, one try</text>
<text x="1390" y="424" text-anchor="middle" font-size="14" fill="#343a40">2. Lead retries with the full log</text>
<text x="1390" y="442" text-anchor="middle" font-size="14" fill="#343a40">Still failing: stop and report</text>
<rect x="60" y="944" width="1570" height="96" rx="14" fill="#f8f9fa" stroke="#343a40" stroke-width="2.5"/>
<text x="845" y="983" text-anchor="middle" font-size="17" fill="#212529"><tspan font-weight="700" fill="#212529">Hooks</tspan> refuse only what can never be right, and ask before what needs your yes.</text>
<text x="845" y="1011" text-anchor="middle" font-size="17" fill="#212529">Commit and pull request names, <tspan font-weight="700" fill="#212529">no trailer</tspan>, <tspan font-weight="700" fill="#212529">protected paths</tspan>, <tspan font-weight="700" fill="#212529">workflow mode</tspan>, <tspan font-weight="700" fill="#212529">read only</tspan> planning.</text>
<rect x="700" y="542" width="170" height="112" rx="14" fill="#ffec99" stroke="#343a40" stroke-width="2.5"/>
<text x="785" y="585" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">Full Gate</text>
<text x="785" y="608" text-anchor="middle" font-size="15" fill="#343a40">Once per commit,</text>
<text x="785" y="628" text-anchor="middle" font-size="15" fill="#343a40">recorded</text>
<polyline points="873,598 935,598 935,398 1000,398" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1173,398 1217,398" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#r)" marker-start="url(#r)"/>
<polyline points="1305,542 1305,463" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#r)" marker-start="url(#r)"/>
<polyline points="1525,654 1525,680 145,680 145,656" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<text x="835" y="699" text-anchor="middle" font-size="14" fill="#495057">Then the next pull request. Ask and auto continue until every pull request is merged or a stop. Local keeps one branch.</text>
<rect x="60" y="722" width="500" height="198" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2.5"/>
<text x="84" y="763" text-anchor="start" font-size="19" font-weight="700" fill="#212529">Local</text>
<text x="84" y="785" text-anchor="start" font-size="14" fill="#495057">Stops at local commits</text>
<text x="84" y="822" text-anchor="start" font-size="15" fill="#343a40">One branch for the whole TODO</text>
<text x="84" y="846" text-anchor="start" font-size="15" fill="#343a40">Never pushes or opens a pull request</text>
<rect x="595" y="722" width="500" height="198" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2.5"/>
<text x="619" y="763" text-anchor="start" font-size="19" font-weight="700" fill="#212529">Ask</text>
<text x="619" y="785" text-anchor="start" font-size="14" fill="#495057">Asks before the remote</text>
<text x="619" y="822" text-anchor="start" font-size="15" fill="#343a40">One pull request per plan item</text>
<text x="619" y="846" text-anchor="start" font-size="15" fill="#343a40">Each push, pull request, and merge asks first</text>
<rect x="1130" y="722" width="500" height="198" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2.5"/>
<text x="1154" y="763" text-anchor="start" font-size="19" font-weight="700" fill="#212529">Auto (Default)</text>
<text x="1154" y="785" text-anchor="start" font-size="14" fill="#495057">Finishes every pull request</text>
<text x="1154" y="822" text-anchor="start" font-size="15" fill="#343a40">Pushes, opens the pull request, watches CI</text>
<text x="1154" y="846" text-anchor="start" font-size="15" fill="#343a40">Merges when the review is clean and CI is green</text>
</svg>
