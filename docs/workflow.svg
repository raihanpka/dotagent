<text x="845" y="908" text-anchor="middle" font-size="16" fill="#212529"><tspan font-weight="700" fill="#212529">Hooks</tspan>: names, <tspan font-weight="700" fill="#212529">no trailer</tspan>, <tspan font-weight="700" fill="#212529">protected paths</tspan>, <tspan font-weight="700" fill="#212529">workflow mode</tspan>, <tspan font-weight="700" fill="#212529">read only</tspan> planning. Every unit logs its proof. No unsolicited docs.</text>
