<text x="1092.49" y="275" text-anchor="middle" font-size="16" fill="#343a40">goal, finish, prove</text>
<rect x="1065" y="440" width="260" height="120" rx="14" fill="#ffec99" stroke="#e67700" stroke-width="2.5"/>
<text x="1195" y="472" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">One unit</text>
<text x="1195" y="502" text-anchor="middle" font-size="16" fill="#343a40">Smallest change,</text>
<text x="1195" y="522" text-anchor="middle" font-size="16" fill="#343a40">only the plan's files</text>
<rect x="962.487" y="687.487" width="260" height="120" rx="14" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="1092.49" y="720" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Verify</text>
<text x="1092.49" y="749" text-anchor="middle" font-size="16" fill="#343a40">Scoped check:</text>
<text x="1092.49" y="770" text-anchor="middle" font-size="16" fill="#343a40">format, lint, test</text>
<rect x="715" y="790" width="260" height="120" rx="14" fill="#99e9f2" stroke="#0b7285" stroke-width="2.5"/>
<text x="845" y="822" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Prove</text>
<text x="845" y="852" text-anchor="middle" font-size="16" fill="#343a40">Real artifact:</text>
<text x="845" y="872" text-anchor="middle" font-size="16" fill="#343a40">run it, read it, show it</text>
<rect x="467.513" y="687.487" width="260" height="120" rx="14" fill="#ffd8a8" stroke="#d9480f" stroke-width="2.5"/>
<text x="597.513" y="720" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Review</text>
<text x="597.513" y="749" text-anchor="middle" font-size="16" fill="#343a40">Fresh context:</text>
<text x="597.513" y="770" text-anchor="middle" font-size="16" fill="#343a40">proof plus gaps</text>
<rect x="365" y="440" width="260" height="120" rx="14" fill="#a5d8ff" stroke="#1864ab" stroke-width="2.5"/>
<text x="495" y="472" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Ship</text>
<text x="495" y="502" text-anchor="middle" font-size="16" fill="#343a40">PR, CI, merge</text>
<text x="495" y="522" text-anchor="middle" font-size="16" fill="#343a40">by the workflow</text>
<rect x="467.513" y="192.513" width="260" height="120" rx="14" fill="#e9ecef" stroke="#495057" stroke-width="2.5"/>
<text x="597.513" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Progress</text>
<text x="597.513" y="254" text-anchor="middle" font-size="16" fill="#343a40">Commit, tick, log,</text>
<text x="597.513" y="275" text-anchor="middle" font-size="16" fill="#343a40">state = moved</text>
