# PR Gate. Runs once per pull request and never on a plain push to a feature branch.
# Make it a required status check in branch protection. Keep it fast: no services, no deploy.
name: PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Lint
        run: make lint
      - name: Vet
        run: make vet
      - name: Build
        run: make build
      - name: Test
        run: make test
