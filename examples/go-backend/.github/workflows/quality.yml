# One run per pull request, the same commands the slicer runs.
name: Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: make build
      - name: Lint
        run: make lint
      - name: Test
        run: make test
