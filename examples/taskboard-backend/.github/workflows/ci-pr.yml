# Pull Request Go Gate. Runs once per pull request and never on a plain push to a feature branch.
# Make it a required status check in branch protection. Keep it fast: no services, no deploy.
name: Pull Request Go Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        run: make test
