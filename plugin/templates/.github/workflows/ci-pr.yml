# PR Gate. Runs once per pull request and never on a plain push to a feature branch.
# Make it a required status check in branch protection. Keep it fast: no services, no deploy.
# Replace every {{...}} with your repo's command. Same commands the worker runs locally.
name: PR Gate

on:
  pull_request:
    branches: [{{default-branch}}]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # {{setup}}: install your toolchain and dependencies, with caching
      - name: Format
        run: "{{format-check}}"
      - name: Lint
        run: "{{lint}}"
      - name: Build
        run: "{{build}}"
      - name: Test
        run: "{{test}}"
      # Optional: {{vulnerability-scan}}, for example govulncheck or npm audit and you can extend based on your language and framework. 
