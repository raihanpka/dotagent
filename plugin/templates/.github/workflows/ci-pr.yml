# Pull Request Gate. Runs once per pull request and never on a plain push to a feature branch.
# Make it a required status check in branch protection. Keep it fast: no services, no deploy.
# Replace every {{...}} with your repo's command. Same commands the agent runs locally.
name: Pull Request {{ }} Gate   # fill {{ }} with one plain word for the stack or product, such as Go

on:
  pull_request:
    branches: [{{ default-branch }}]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # {{setup}}: install your toolchain and dependencies, with caching
      - name: Format
        run: "{{format-check}}"
      - name: Lint
        run: "{{lint}}"
      - name: Build
        run: "{{build}}"
      - name: Test
        run: "{{test}}"
      # Add what the stack has, keep the whole run under about 10 minutes:
      # - name: Vulnerabilities    run: "{{dependency-scan}}"   (govulncheck, npm audit, pip-audit)
      # - name: Secrets            uses: gitleaks/gitleaks-action  (secret scan)
      # Type check belongs with Lint when the language has one.
